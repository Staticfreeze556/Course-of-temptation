name: Inspect Mod Compatibility

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Rename Input Archive to Mods.zip
    types:
      - completed
  push:
    paths:
      - 'CourseOfTemptation.html'
      - 'output/merged-mods/**'
      - '.github/workflows/inspect-mod-compatibility.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Inspect archives and original HTML
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p inspection-output

          cat > inspection-output/inspect.py <<'PY'
          import collections
          import hashlib
          import html
          import os
          import re
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          original_zip = Path("input.mods/Mods.zip")
          candidate_zip = Path(
              "output/merged-mods/merged-mods-v0.8.4d.zip"
          )
          game_path = Path("CourseOfTemptation.html")
          report_path = Path("inspection-output/CompatibilityReport.md")

          blockers = []
          warnings = []
          report = [
              "# Mod compatibility inspection",
              "",
              f'- Inspected checkout: {os.environ.get("GITHUB_SHA", "unknown")}',
              "",
              "## Scope",
              "",
              "- Read-only archive and source-text inspection.",
              "- No mod code or patcher executable is executed.",
              "- No mods, ZIPs, or game HTML are modified.",
              "- Exact source matches are evidence, not proof of gameplay compatibility.",
              "- Missing matches can also be targets introduced by another replacement.",
              "- This is not the diagnostic patch replay or a JavaScript syntax check.",
              "",
          ]

          def escape_cell(text):
              return text.replace("|", r"\|").replace("`", "'")

          def short(text, limit=140):
              text = re.sub(r"\s+", " ", text)
              return text[:limit] + ("..." if len(text) > limit else "")

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          game = ""
          if not game_path.is_file():
              blockers.append("Original HTML missing: CourseOfTemptation.html")
          else:
              try:
                  game = game_path.read_text(encoding="utf-8-sig")
              except UnicodeError as exc:
                  blockers.append(f"Original HTML is not valid UTF-8: {exc}")

          report += ["## Original game", ""]

          if game:
              decoded = html.unescape(game)
              versions = sorted(set(re.findall(
                  r'Config\.saves\.version\s*(?:=|to)\s*'
                  r'["\'](v[^"\'\s<>]+)["\']',
                  decoded,
              )))
              report += [
                  f'- Version values found: {", ".join(versions) or "none"}',
                  f"- HTML SHA256: {sha(game_path)}",
                  "",
              ]
              if versions != ["v0.8.4d"]:
                  blockers.append(
                      "Current merger requires only v0.8.4d; "
                      f"version values found: {versions}"
                  )
          else:
              report += ["- Original HTML could not be inspected.", ""]

          normalized_game = re.sub(r"\s+", "", game)

          def inspect_archive(path, label, required=False):
              report.extend([f"## {label}", "", f"- Path: {path}", ""])

              if not path.is_file():
                  if required:
                      blockers.append(f"Required archive missing: {path}")
                  report.extend(["Archive not present.", ""])
                  return None

              archive_mods = {}
              entries = []
              unsupported = []
              scope_errors = []

              try:
                  with zipfile.ZipFile(path) as archive:
                      bad = archive.testzip()
                      if bad is not None:
                          raise ValueError(f"ZIP integrity failure at {bad}")

                      seen = set()

                      for info in archive.infolist():
                          if info.is_dir():
                              continue

                          name = info.filename.replace("\\", "/")
                          pure = PurePosixPath(name)

                          if (
                              pure.is_absolute()
                              or ".." in pure.parts
                              or re.match(r"^[A-Za-z]:", name)
                          ):
                              scope_errors.append(f"Unsafe archive path: {name}")
                              continue

                          if (
                              "__MACOSX" in pure.parts
                              or pure.name.startswith("._")
                          ):
                              continue

                          key = name.casefold()
                          if key in seen:
                              scope_errors.append(
                                  f"Duplicate case-insensitive path: {name}"
                              )
                              continue
                          seen.add(key)

                          if not name.lower().endswith(".mod"):
                              continue

                          raw = archive.read(info)
                          try:
                              text = raw.decode("utf-8-sig")
                          except UnicodeError as exc:
                              scope_errors.append(
                                  f"Invalid UTF-8 in {name}: {exc}"
                              )
                              continue

                          text = text.replace("\r\n", "\n")

                          if "\r" in text:
                              scope_errors.append(
                                  f"Standalone carriage return in {name}"
                              )

                          archive_mods[name] = text

                          markers = []
                          if "Replace:" in text and "With:" in text:
                              markers.append("Replace:/With:")
                          if re.search(r"^Add Passage:", text, re.M):
                              markers.append("Add Passage:")
                          if "<e>" in text:
                              markers.append("<e>")

                          if markers:
                              unsupported.append((name, ", ".join(markers)))

                          parsed = 0
                          for segment in text.split("~~"):
                              if "~" not in segment:
                                  continue
                              old, new = segment.split("~", 1)
                              old, new = old.strip(), new.strip()
                              entries.append((name, old, new))
                              parsed += 1

                              if not old:
                                  scope_errors.append(
                                      f"Empty search target in {name}"
                                  )

                          if not parsed:
                              warnings.append(
                                  f"{label}: no ~~ / ~ replacements parsed "
                                  f"from {name}; inspect its format."
                              )

              except Exception as exc:
                  blockers.append(f"{label}: cannot inspect ZIP: {exc}")
                  report.extend([f"ZIP inspection failed: {exc}", ""])
                  return None

              blockers.extend(
                  f"{label}: {message}" for message in scope_errors
              )

              if len(archive_mods) != 52:
                  blockers.append(
                      f"{label}: current workflow expects 52 readable mod "
                      f"files; found {len(archive_mods)}."
                  )

              owners = collections.defaultdict(list)
              for name, old, new in entries:
                  owners[old].append(name)

              shared = {
                  old: sorted(set(names))
                  for old, names in owners.items()
                  if len(set(names)) > 1
              }

              missing = []
              exact = 0
              multiple = []

              for name, old, new in entries:
                  if not old or not game:
                      continue

                  count = game.count(old)
                  if count:
                      exact += 1
                      if count > 1:
                          multiple.append((name, old, count))
                  else:
                      normalized = re.sub(r"\s+", "", old)
                      detail = (
                          "Whitespace-only difference is a possibility"
                          if normalized and normalized in normalized_game
                          else "No exact match in original HTML"
                      )
                      missing.append((name, old, detail))

              report.extend([
                  f"- ZIP SHA256: {sha(path)}",
                  f"- Readable mod files: {len(archive_mods)}",
                  f"- Entries parsed using ~~ / ~ format: {len(entries)}",
                  f"- Entries with an exact original-HTML match: {exact}",
                  f"- Entries without an exact original-HTML match: {len(missing)}",
                  f"- Shared targets across files: {len(shared)}",
                  "",
              ])

              if shared:
                  warnings.append(
                      f"{label}: {len(shared)} shared targets found. "
                      "The merger handles only its five configured groups."
                  )
                  report.extend(["### Shared targets", ""])
                  for old, names in shared.items():
                      report.append(
                          f"- `{escape_cell(short(old))}` — "
                          + ", ".join(escape_cell(name) for name in names)
                      )
                  report.append("")

              if missing:
                  warnings.append(
                      f"{label}: {len(missing)} entries have no exact match "
                      "in the original HTML; review their report details."
                  )
                  report.extend([
                      "### Targets without exact original-HTML matches",
                      "",
                  ])
                  for name, old, detail in missing:
                      report.append(
                          f"- {escape_cell(name)}: "
                          f"`{escape_cell(short(old))}` — {detail}"
                      )
                  report.append("")

              if multiple:
                  warnings.append(
                      f"{label}: {len(multiple)} entries match more than "
                      "one original location."
                  )
                  report.extend(["### Targets matching multiple locations", ""])
                  for name, old, count in multiple:
                      report.append(
                          f"- {escape_cell(name)}: "
                          f"`{escape_cell(short(old))}` — {count} matches"
                      )
                  report.append("")

              if unsupported:
                  warnings.append(
                      f"{label}: additional patch-format markers found; "
                      "the merger's ~~ / ~ parser does not inspect them."
                  )
                  report.extend(["### Additional format markers", ""])
                  for name, markers in unsupported:
                      report.append(f"- {escape_cell(name)}: {markers}")
                  report.append("")

              return {
                  "mods": archive_mods,
                  "entries": entries,
                  "shared": shared,
              }

          original = inspect_archive(
              original_zip, "Original mods", required=True
          )
          candidate = inspect_archive(
              candidate_zip, "Merged candidate", required=False
          )

          trio = [
              "KittyBuyOtherResidences.mod",
              "KittyPetNames.mod",
              "KittyPregnancyMod.mod",
          ]

          startup_old = "&lt;&lt;set $pcage to 18&gt;&gt;"
          startup_anchor = (
              "&lt;&lt;set $pcbirthday to setup.random_birthday()&gt;&gt;\n"
              "&lt;&lt;set $pcage to setup.minimum_pc_starting_age()&gt;&gt;"
          )

          groups = [
              ("this.tattoos = {};", trio, "this.tattoos = {};"),
              (
                  "this.age = State.variables.pcage;",
                  trio,
                  "this.age = State.variables.pcage;",
              ),
              (
                  "//#endregion Clothing Management",
                  trio,
                  "//#endregion Clothing Management",
              ),
              (
                  "return [...new Set(inclins)];\n}",
                  ["KittyBuyOtherResidences.mod", "KittyPregnancyMod.mod"],
                  "return [...new Set(inclins)];\n}",
              ),
              (
                  startup_old,
                  [
                      "KittyBuyOtherResidences.mod",
                      "KittyFollowers.mod",
                      "KittyGoOverAnybodysHouse.mod",
                      "KittyPetNames.mod",
                      "KittyPregnancyMod.mod",
                  ],
                  startup_anchor,
              ),
          ]

          report.extend(["## Current merger prerequisites", ""])

          if original:
              names_by_base = collections.defaultdict(list)
              for name in original["mods"]:
                  names_by_base[PurePosixPath(name).name.casefold()].append(name)

              for target, expected_bases, anchor in groups:
                  group_errors = []
                  expected_paths = []

                  for base in expected_bases:
                      found = names_by_base[base.casefold()]
                      if len(found) != 1:
                          group_errors.append(
                              f"Expected exactly one {base}; found {len(found)}"
                          )
                      else:
                          expected_paths.append(found[0])

                  matching = [
                      entry for entry in original["entries"]
                      if entry[1] == target
                  ]
                  counts = collections.Counter(
                      name for name, old, new in matching
                  )

                  if (
                      set(counts) != set(expected_paths)
                      or any(count != 1 for count in counts.values())
                  ):
                      group_errors.append(
                          "Target ownership or entry counts differ from "
                          "the configured merge group"
                      )

                  if game.count(anchor) != 1:
                      group_errors.append(
                          f"Expected one original anchor match; "
                          f"found {game.count(anchor)}"
                      )

                  for name, old, new in matching:
                      if not new.startswith(old):
                          group_errors.append(
                              f"Replacement does not retain anchor: {name}"
                          )
                          continue
                      tail = new[len(old):].strip()
                      if not tail or "~" in tail:
                          group_errors.append(
                              f"Empty addition or unexpected separator: {name}"
                          )

                  status = "BLOCKED" if group_errors else "PASS"
                  report.append(
                      f"- {status}: `{escape_cell(short(target))}`"
                  )
                  for error in group_errors:
                      blockers.append(
                          f"Merger group {short(target)}: {error}"
                      )
                      report.append(f"  - {escape_cell(error)}")
              report.append("")
          else:
              report.extend([
                  "Not checked because the original archive was unavailable.",
                  "",
              ])

          if candidate:
              report.extend(["## Candidate merge structure", ""])
              for old, bases, anchor in groups:
                  matches = [
                      entry for entry in candidate["entries"]
                      if entry[1] == anchor
                  ]
                  if len(matches) != 1:
                      blockers.append(
                          f"Merged candidate: expected one surviving entry "
                          f"for {short(anchor)}; found {len(matches)}."
                      )
                  report.append(
                      f"- `{escape_cell(short(anchor))}`: "
                      f"{len(matches)} surviving entries"
                  )

              if any(
                  old == startup_old
                  for name, old, new in candidate["entries"]
              ):
                  blockers.append(
                      "Merged candidate still contains the obsolete "
                      "fixed-age startup target."
                  )

              warnings.append(
                  "Candidate freshness is not verified: this inspection "
                  "does not prove the candidate was built from the current "
                  "original archive."
              )
              report.append("")

          report.extend(["## Blocking findings", ""])
          report.extend(
              [f"- {escape_cell(item)}" for item in blockers]
              or ["- None detected by these checks."]
          )

          report.extend(["", "## Review warnings", ""])
          report.extend(
              [f"- {escape_cell(item)}" for item in warnings]
              or ["- None detected by these checks."]
          )

          if blockers:
              status = "BLOCKED"
              advice = (
                  "Resolve blocking findings before merging or patching. "
                  "Workflow assumptions may need updating."
              )
          elif warnings:
              status = "REVIEW REQUIRED"
              advice = (
                  "The checked merger prerequisites passed, but review the "
                  "warnings before proceeding. Compatibility is not certified."
              )
          else:
              status = "STATIC CHECKS PASSED"
              advice = (
                  "No issue was detected by these checks. Actual patcher "
                  "execution and gameplay testing are still required."
              )

          report.extend([
              "",
              "## Inspection result",
              "",
              f"- Status: {status}",
              f"- {advice}",
              "",
              "## Known repair scope",
              "",
              "The existing merger only combines five specific shared groups.",
              "It does not repair rent-event registration, calendar logic,",
              "rent-state synchronization, rental-action strings, other",
              "missing replacements, or Cheatplus compatibility.",
              "",
              "This workflow does not automatically gate the separate",
              "manual merger or the existing patch workflow.",
              "",
          ])

          report_path.write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as output:
                  output.write(report_path.read_text(encoding="utf-8"))

          print(
              f"Inspection: {status}; "
              f"{len(blockers)} blocking findings; "
              f"{len(warnings)} review warnings."
          )

          sys.exit(1 if blockers else 0)
          PY

          python inspection-output/inspect.py

      - name: Upload compatibility inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Compatibility-Inspection-${{ github.run_number }}
          path: inspection-output/CompatibilityReport.md
          if-no-files-found: warn
