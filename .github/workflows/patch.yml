name: 04 - Inspect Candidate and Patch

on:
  workflow_dispatch:
    inputs:
      merge_run_id:
        description: 'Run ID from 03 - Merge Reviewed Mods.'
        required: true
        type: string
      patcher_release_tag:
        description: 'Exact release tag containing KittyPatcher*.zip.'
        required: true
        type: string
      accept_static_warnings:
        description: 'I reviewed candidate warnings from a previous preflight and accept diagnostic patching.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_RUN_ID: ${{ inputs.merge_run_id }}
      PATCHER_RELEASE_TAG: ${{ inputs.patcher_release_tag }}
      ACCEPT_STATIC_WARNINGS: ${{ inputs.accept_static_warnings }}

    steps:
      - name: Check out current original inputs
        uses: actions/checkout@v4

      - name: Validate selected merge run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:MERGE_RUN_ID -notmatch '^\d+$') {
            throw 'Merge Run ID must contain digits only.'
          }

          if ([string]::IsNullOrWhiteSpace($env:PATCHER_RELEASE_TAG)) {
            throw 'Enter the exact KittyPatcher release tag.'
          }

          New-Item -ItemType Directory -Path 'work' -Force | Out-Null

          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:MERGE_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not retrieve the selected merge run.'
          }

          $run = ($response -join "`n") | ConvertFrom-Json

          if ($run.path -ne '.github/workflows/merge.yml') {
            throw 'The selected Run ID is not from the merge workflow.'
          }

          if ($run.conclusion -ne 'success') {
            throw 'The selected merge run was not successful.'
          }

          $run | ConvertTo-Json -Depth 30 |
            Set-Content -LiteralPath 'work/MergeRun.json' -Encoding utf8

      - name: Download selected candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: Merged-Mods-${{ inputs.merge_run_id }}
          path: work/_candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.merge_run_id }}

      - name: Verify manifest and inspect candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python scripts/check_candidate.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Candidate preflight stopped. Download the inspection report before proceeding.'
          }

      - name: Copy original HTML into working folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Copy-Item -LiteralPath 'CourseOfTemptation.html' `
            -Destination 'work/CourseOfTemptation.html'

      - name: Download selected KittyPatcher release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path 'work/_patcher_dl' -Force |
            Out-Null

          gh release download "$env:PATCHER_RELEASE_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern 'KittyPatcher*.zip' `
            --dir 'work/_patcher_dl'

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download KittyPatcher from the selected release tag.'
          }

          $zips = @(
            Get-ChildItem -LiteralPath 'work/_patcher_dl' `
              -Filter 'KittyPatcher*.zip' -File
          )

          if ($zips.Count -ne 1) {
            throw "Expected exactly one KittyPatcher ZIP; found $($zips.Count)."
          }

          Write-Host "Selected patcher ZIP: $($zips[0].Name)"

          $patcherHash = (Get-FileHash -LiteralPath $zips[0].FullName `
            -Algorithm SHA256).Hash

          @(
            '# Patcher selection'
            ''
            "- Release tag: $env:PATCHER_RELEASE_TAG"
            "- Asset: $($zips[0].Name)"
            "- SHA256: $patcherHash"
            ''
          ) | Set-Content -LiteralPath 'work/PatcherSelection.md' -Encoding utf8

          Expand-Archive -LiteralPath $zips[0].FullName `
            -DestinationPath 'work/_patcher' -Force

      - name: Run KittyPatcher against the candidate
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = (Resolve-Path 'work/_patcher').Path

          $candidates = @(
            Get-ChildItem -LiteralPath $root -File `
              -Filter 'KittyPatcher*.exe'
          )

          if ($candidates.Count -eq 0) {
            $candidates = @(
              Get-ChildItem -LiteralPath $root -Recurse -File `
                -Filter 'KittyPatcher*.exe'
            )
          }

          if ($candidates.Count -ne 1) {
            throw "Expected exactly one patcher EXE; found $($candidates.Count)."
          }

          $exe = $candidates[0]

          Write-Host "Using patcher: $($exe.FullName)"

          Copy-Item -LiteralPath $exe.FullName `
            -Destination (Join-Path 'work' $exe.Name)

          Push-Location 'work'

          try {
            @('') | & ".\$($exe.Name)"
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }

          if ($code -ne 0) {
            throw "KittyPatcher exited with code $code."
          }

          Remove-Item -LiteralPath (Join-Path 'work' $exe.Name) -Force

      - name: Generate diagnostic patch report
        id: report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python scripts/patch_report.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Patch report generation failed.'
          }

          $firstLine = Get-Content `
            -LiteralPath 'work/StructuredPatchReport.md' `
            -TotalCount 1

          if ($firstLine -ne '# Patch report') {
            throw 'Structured patch report validation failed.'
          }

          Get-Content -LiteralPath 'work/StructuredPatchReport.md' `
            -TotalCount 10

      - name: Add diagnostic build badge
        shell: pwsh
        env:
          BUILD_STATUS: ${{ steps.report.outputs.badge }}
        run: |
          $ErrorActionPreference = 'Stop'

          $path = (Resolve-Path 'work/CourseOfTemptation.html').Path
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [IO.File]::ReadAllText($path, $utf8)
          $message = [System.Net.WebUtility]::HtmlEncode($env:BUILD_STATUS)

          $badge = '<div id="modded-build-badge" style="position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#222;color:#fff;font:14px/1.3 sans-serif;padding:8px 44px 8px 12px;text-align:center;">' + $message + '<button type="button" aria-label="Dismiss" onclick="this.parentNode.remove()" style="position:absolute;right:6px;top:4px;background:none;border:0;color:#fff;font-size:22px;">&times;</button></div>'

          $index = $text.LastIndexOf('</body>', [StringComparison]::Ordinal)

          if ($index -lt 0) {
            throw 'No closing body tag found; badge was not added.'
          }

          $text = $text.Substring(0, $index) + $badge + $text.Substring($index)
          [IO.File]::WriteAllText($path, $text, $utf8)

      - name: Upload candidate inspection and patch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patch-Reports-${{ github.run_id }}
          path: |
            work/CandidateInspection.md
            work/StructuredPatchReport.md
            work/PatcherSelection.md
          if-no-files-found: warn

      - name: Upload diagnostic game output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic-Game-${{ github.run_id }}
          path: work/CourseOfTemptation.html
          if-no-files-found: error

      - name: Upload raw patcher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raw-Patcher-Logs-${{ github.run_id }}
          path: work/mods/logs/*.txt
          if-no-files-found: ignore
