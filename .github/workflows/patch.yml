name: Patch Course of Temptation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare clean game and mods
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $games = @(
            Get-ChildItem -LiteralPath "." -File |
            Where-Object {
              $_.Name -ieq "CourseOfTemptation.html"
            }
          )

          if ($games.Count -ne 1) {
            throw "Put CourseOfTemptation.html in the repository's main folder."
          }

          New-Item -ItemType Directory -Path "work/mods" -Force |
            Out-Null

          Copy-Item -LiteralPath $games[0].FullName `
            -Destination "work/CourseOfTemptation.html"

          $modRoot = $null
          $modZip = "mods/mods.zip"

          if (Test-Path -LiteralPath $modZip -PathType Leaf) {
            Write-Host "Extracting $modZip"

            Expand-Archive `
              -LiteralPath $modZip `
              -DestinationPath "extracted-mods" -Force

            $modRoot = (
              Resolve-Path -LiteralPath "extracted-mods"
            ).Path

            Write-Host "Using mods from the ZIP. Loose repository mods are ignored."
          } elseif (Test-Path -LiteralPath "mods" -PathType Container) {
            $modRoot = (
              Resolve-Path -LiteralPath "mods"
            ).Path

            Write-Host "No mods.zip found. Checking for loose .mod files."
          }

          $mods = @()

          if ($null -ne $modRoot) {
            $mods = @(
              Get-ChildItem -LiteralPath $modRoot `
                -Filter "*.mod" -File -Recurse
            )

            foreach ($mod in $mods) {
              $relative = [System.IO.Path]::GetRelativePath(
                $modRoot, $mod.FullName
              )

              $destination = Join-Path "work/mods" $relative
              $parent = Split-Path -Parent $destination

              New-Item -ItemType Directory -Path $parent -Force |
                Out-Null

              Copy-Item -LiteralPath $mod.FullName `
                -Destination $destination
            }
          }

          if (
            (Test-Path -LiteralPath $modZip -PathType Leaf) -and
            $mods.Count -eq 0
          ) {
            throw "mods/mods.zip contains no .mod files. Extract any nested ZIPs before creating your combined archive."
          }

          "mod_count=$($mods.Count)" >> $env:GITHUB_OUTPUT
          Write-Host "Found $($mods.Count) mod file(s)."

      - name: Download latest patcher
        if: steps.prepare.outputs.mod_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          gh release download `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "KittyPatcher*.zip" `
            --dir "download"

          if ($LASTEXITCODE -ne 0) {
            throw "Could not download KittyPatcher. Ensure the latest release contains one KittyPatcher ZIP."
          }

          $archives = @(
            Get-ChildItem -LiteralPath "download" `
              -Filter "*.zip" -File
          )

          if ($archives.Count -ne 1) {
            throw "The latest release must contain exactly one matching KittyPatcher ZIP."
          }

          Write-Host "Downloaded: $($archives[0].Name)"

          Expand-Archive `
            -LiteralPath $archives[0].FullName `
            -DestinationPath "patcher-package" -Force

          $candidates = @(
            Get-ChildItem -LiteralPath "patcher-package" `
              -Filter "*.exe" -File -Recurse |
            Where-Object {
              $_.BaseName -match "^KittyPatcher(?:$|[ ._-])"
            }
          )

          $packageRoot = (
            Resolve-Path -LiteralPath "patcher-package"
          ).Path

          $topLevel = @(
            $candidates |
            Where-Object {
              $_.DirectoryName -eq $packageRoot
            }
          )

          if ($topLevel.Count -eq 1) {
            $exe = $topLevel[0]
          } elseif (
            $topLevel.Count -eq 0 -and
            $candidates.Count -eq 1
          ) {
            $exe = $candidates[0]
          } else {
            $candidates | ForEach-Object {
              Write-Host $_.FullName
            }

            throw "Could not unambiguously select the patcher EXE."
          }

          Copy-Item -LiteralPath $exe.FullName `
            -Destination (Join-Path "work" $exe.Name)

          "PATCHER_NAME=$($exe.Name)" >> $env:GITHUB_ENV
          Write-Host "Selected: $($exe.Name)"

      - name: Apply mods
        if: steps.prepare.outputs.mod_count != '0'
        working-directory: work
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"

          $patcher = Join-Path "." $env:PATCHER_NAME

          Write-Host "Running $env:PATCHER_NAME"
          "" | & $patcher

          if ($LASTEXITCODE -ne 0) {
            throw "KittyPatcher exited with code $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath "CourseOfTemptation.html")) {
            throw "The game HTML is missing after patching."
          }

      - name: Add modded-build notice
        if: steps.prepare.outputs.mod_count != '0'
        env:
          MOD_COUNT: ${{ steps.prepare.outputs.mod_count }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path (
            Get-Location
          ).Path "work/CourseOfTemptation.html"

          $html = [System.IO.File]::ReadAllText($path)
          $count = [int]$env:MOD_COUNT

          $notice = @'
          <!-- KittyPatcher build notice -->
          <script>
          (() => {
            const modCount = __MOD_COUNT__;

            function showModNotice() {
              if (document.getElementById("kitty-build-notice")) {
                return;
              }

              const notice = document.createElement("div");
              notice.id = "kitty-build-notice";
              notice.setAttribute("role", "status");

              notice.style.cssText =
                "position:fixed;" +
                "left:12px;right:12px;" +
                "bottom:calc(12px + env(safe-area-inset-bottom, 0px));" +
                "z-index:2147483647;" +
                "box-sizing:border-box;" +
                "padding:12px;" +
                "border:1px solid #7ac98a;" +
                "border-radius:10px;" +
                "background:#17251c;" +
                "color:#ffffff;" +
                "font:14px/1.45 system-ui,sans-serif;" +
                "box-shadow:0 3px 16px rgba(0,0,0,.4);" +
                "display:flex;align-items:center;gap:12px;";

              const text = document.createElement("span");
              text.style.flex = "1";
              text.textContent =
                "Modded build - patcher completed with " +
                modCount +
                " mod files. Check patch logs for unmatched patches.";

              const close = document.createElement("button");
              close.type = "button";
              close.textContent = "Dismiss";
              close.setAttribute("aria-label", "Dismiss mod build notice");

              close.style.cssText =
                "flex-shrink:0;padding:8px 12px;" +
                "border:1px solid #7ac98a;border-radius:6px;" +
                "background:#263e2d;color:white;" +
                "font:inherit;cursor:pointer;";

              close.addEventListener("click", () => notice.remove());

              notice.append(text, close);
              document.body.appendChild(notice);
            }

            if (document.readyState === "loading") {
              document.addEventListener(
                "DOMContentLoaded",
                showModNotice,
                { once: true }
              );
            } else {
              showModNotice();
            }
          })();
          </script>
          '@

          $notice = $notice.Replace(
            "__MOD_COUNT__", $count.ToString()
          )

          $position = $html.LastIndexOf(
            "</body>",
            [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($position -lt 0) {
            throw "Could not find the closing body tag to add the notice."
          }

          $html = $html.Insert($position, $notice)

          [System.IO.File]::WriteAllText(
            $path,
            $html,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Added modded-build notice for $count mod files."

      - name: Package successful result
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path "output" -Force |
            Out-Null

          Copy-Item -LiteralPath "work/CourseOfTemptation.html" `
            -Destination "output/"

          if (Test-Path -LiteralPath "work/mods/logs") {
            Copy-Item -LiteralPath "work/mods/logs" `
              -Destination "output/logs" -Recurse -Force
          }

      - name: Upload game and patch logs
        uses: actions/upload-artifact@v4
        with:
          name: CourseOfTemptation-game
          path: output/
          if-no-files-found: error

      - name: Upload logs if patching failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patcher-failure-logs
          path: work/mods/logs/
          if-no-files-found: ignore
