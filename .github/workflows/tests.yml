name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.3 pyyaml==6.0.2
      - run: python -m pytest -v tests
      - name: Inventory report
        if: always()
        run: python tools/inventory.py >> "$GITHUB_STEP_SUMMARY"
