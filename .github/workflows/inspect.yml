name: 02 - Inspect Input Compatibility

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 01 - Prepare Input Mods
    types:
      - completed
  push:
    paths:
      - 'CourseOfTemptation.html'
      - 'scripts/inspect_mods.py'
      - 'docs/AI-HANDOFF.md'
      - '.github/workflows/inspect.yml'

permissions:
  contents: read

concurrency:
  group: inspect-input-mods-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out prepared inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Inspect original mods and game
        run: python scripts/inspect_mods.py

      - name: Include AI handoff in diagnostic bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p inspection-output

          if [ ! -f docs/AI-HANDOFF.md ]; then
            echo "::error::Missing docs/AI-HANDOFF.md. Create it before generating a complete AI diagnostic bundle."
            exit 1
          fi

          cp docs/AI-HANDOFF.md inspection-output/AI-HANDOFF.md

          {
            echo "## AI diagnostic bundle"
            echo ""
            echo "- Download the Input-Compatibility-Report artifact."
            echo "- It includes the AI handoff and any diagnostic files successfully generated."
            echo "- Give the bundle to your AI assistant."
            echo "- If your AI cannot read ZIP attachments, extract it and attach the files."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AI handoff and diagnostic files together
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Input-Compatibility-Report-${{ github.run_number }}
          path: |
            inspection-output/AI-HANDOFF.md
            inspection-output/CompatibilityReport.md
            inspection-output/InspectionData.json
          if-no-files-found: warn
