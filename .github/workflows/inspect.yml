name: 02 - Inspect Input Compatibility

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 01 - Prepare Input Mods
    types: [completed]
  push:
    paths:
      - 'CourseOfTemptation.html'
      - 'Mods.zip'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/inspect.yml'
      - '.github/workflows/merge.yml'
      - '.github/workflows/prepare.yml'

permissions:
  contents: read

concurrency:
  group: inspect-input-mods-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact inspected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Run compatibility inspection
        run: python scripts/inspect_mods.py

      - name: Build complete AI diagnostic bundle
        if: always()
        run: python scripts/build_diagnostic_bundle.py

      - name: Upload complete AI diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Input-Compatibility-Report-${{ github.run_number }}
          path: inspection-output/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize inspection
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -f inspection-output/CompatibilityReport.md ]; then
            cat inspection-output/CompatibilityReport.md >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The artifact is source-bearing and commit-consistent. See BundleManifest.json." >> "$GITHUB_STEP_SUMMARY"
