name: Diagnostic - Cheatplus Entity Probe
run-name: "Cheatplus entity probe — ${{ github.ref_name }}"

on:
  push:
    branches: [fix/cheatplus-escaping-regression]
    paths:
      - '.github/scripts/probe_cheatplus_entities.py'
      - '.github/workflows/cheatplus-entity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve latest patcher once
        shell: pwsh
        run: |
          python .github/scripts/select_patcher.py resolve --repo "$env:GITHUB_REPOSITORY" --out probe-selection
          if ($LASTEXITCODE -ne 0) { throw 'Selection failed.' }
      - name: Download and verify published digest
        shell: pwsh
        run: |
          python .github/scripts/select_patcher.py download --selection probe-selection/selection.json
          if ($LASTEXITCODE -ne 0) { throw 'Download failed.' }
          python .github/scripts/select_patcher.py verify --selection probe-selection/selection.json
          if ($LASTEXITCODE -ne 0) { throw 'Verification failed. No digest override is permitted.' }
      - name: Run isolated synthetic cases
        shell: pwsh
        run: |
          python .github/scripts/probe_cheatplus_entities.py --selection probe-selection/selection.json --out entity-probe-output
          if ($LASTEXITCODE -ne 0) { throw 'Probe findings. Read the diagnostic artifact.' }
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cheatplus-Entity-Probe--Diagnostic-Only
          path: |
            entity-probe-output/
            probe-selection/selection.json
            probe-selection/PatcherSelection.md
          if-no-files-found: warn
          retention-days: 30
