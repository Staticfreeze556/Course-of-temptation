name: 03 - Merge and Patch Reviewed Mods
run-name: "Build modded game — ${{ github.ref_name }} — run #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      inspection_reviewed:
        description: 'I reviewed the current inspection and updated the merger where required.'
        required: true
        type: boolean
        default: false
      accept_static_warnings:
        description: 'I reviewed candidate warnings and accept diagnostic patching.'
        required: true
        type: boolean
        default: false
      approve_unverified_patcher_sha256:
        description: 'Only if the latest KittyPatcher asset has no published digest: the SHA256 you independently confirmed. Leave empty otherwise.'
        required: false
        type: string
        default: ''
      accept_patcher_behavior_findings:
        description: 'Accept patcher canary findings and produce a build labeled diagnostic.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: merge-and-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge reviewed original mods
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      candidate_artifact: ${{ steps.artifact_info.outputs.name }}

    steps:
      - name: Require inspection review
        env:
          INSPECTION_REVIEWED: ${{ inputs.inspection_reviewed }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$INSPECTION_REVIEWED" != "true" ]; then
            echo "::error::Review the current inspection before starting this build."
            exit 1
          fi

      - name: Check out selected build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set candidate artifact name
        id: artifact_info
        shell: bash
        run: |
          echo "name=Merged-Mods-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Apply reviewed merge rules
        run: python .github/scripts/merge_mods.py

      - name: Verify merge outputs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          output = Path("merge-output")
          archive = output / "Merged_Mods.zip"
          manifest = output / "MergeManifest.json"

          if not archive.is_file() or not manifest.is_file():
              raise SystemExit("Candidate archive or manifest is missing.")

          data = json.loads(manifest.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("Merge manifest must contain a JSON object.")

          with zipfile.ZipFile(archive) as handle:
              bad = handle.testzip()

              if bad is not None:
                  raise SystemExit(f"Candidate ZIP integrity failure: {bad}")

              mods = [
                  item for item in handle.infolist()
                  if not item.is_dir()
                  and item.filename.lower().endswith(".mod")
              ]

              if not mods:
                  raise SystemExit("Candidate contains no .mod files.")

          print(f"Candidate contains {len(mods)} mod files.")
          PY

      - name: Upload candidate archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_info.outputs.name }}
          path: |
            merge-output/Merged_Mods.zip
            merge-output/MergeManifest.json
          if-no-files-found: error

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Merge-Report
          path: merge-output/MergeReport.md
          if-no-files-found: warn

      - name: Show continuation
        env:
          CANDIDATE_ARTIFACT: ${{ steps.artifact_info.outputs.name }}
        shell: bash
        run: |
          {
            echo "## Build continuation"
            echo ""
            echo "- Candidate artifact: $CANDIDATE_ARTIFACT"
            echo "- Candidate inspection runs next."
            echo "- Patching proceeds only if checks permit."
            echo "- KittyPatcher is selected from this repository's latest release."
            echo "- No release tag or Merge Run ID entry is required."
          } >> "$GITHUB_STEP_SUMMARY"

  patch:
    name: Inspect candidate and patch game
    needs: merge
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_RUN_ID: ${{ github.run_id }}
      ACCEPT_STATIC_WARNINGS: ${{ inputs.accept_static_warnings }}

    steps:
      - name: Check out the same build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve latest KittyPatcher release (once per build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The ONLY place "latest" is resolved. Every later step uses
          # work/_patcher/selection.json (release ID + asset ID).
          python .github/scripts/select_patcher.py resolve `
            --repo "$env:GITHUB_REPOSITORY" --out 'work/_patcher'
          if ($LASTEXITCODE -ne 0) { throw 'KittyPatcher release selection failed.' }

      - name: Create working folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path 'work/_candidate' -Force |
            Out-Null

          if (Test-Path -LiteralPath 'work/mods') {
            Remove-Item -LiteralPath 'work/mods' -Recurse -Force
          }

      - name: Download candidate from merge job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.merge.outputs.candidate_artifact }}
          path: work/_candidate

      - name: Verify manifest and inspect candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python .github/scripts/check_candidate.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Candidate checks stopped the build. Read CandidateInspection.md.'
          }

      - name: Prepare accepted mods for KittyPatcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python - @'
          import json
          import shutil
          from pathlib import Path

          root = Path("work/mods")
          staging = Path("work/_flat_mods")

          if not root.is_dir():
              raise SystemExit("Candidate checker did not create work/mods.")

          mods = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() == ".mod"
          )

          manifest = json.loads(
              Path("work/_candidate/MergeManifest.json").read_text(
                  encoding="utf-8"
              )
          )

          if not mods or len(mods) != manifest.get("mod_count"):
              raise SystemExit("Accepted mod count does not match the manifest.")

          seen = set()

          for path in mods:
              key = path.name.casefold()

              if key in seen:
                  raise SystemExit(
                      f"Duplicate mod basename cannot be flattened: {path.name}"
                  )

              seen.add(key)

          if staging.exists():
              shutil.rmtree(staging)

          staging.mkdir(parents=True)

          for path in mods:
              shutil.copyfile(path, staging / path.name)

          shutil.rmtree(root)
          staging.rename(root)

          print(f"Prepared {len(mods)} accepted mods, with one copy per mod.")
          '@

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not prepare accepted mods for KittyPatcher.'
          }

      - name: Copy original game into working folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Copy-Item -LiteralPath 'CourseOfTemptation.html' `
            -Destination 'work/CourseOfTemptation.html' `
            -Force

          if (-not (Test-Path -LiteralPath 'work/CourseOfTemptation.html')) {
            throw 'Working game HTML is missing.'
          }

      - name: Download selected KittyPatcher asset by ID
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/select_patcher.py download --selection 'work/_patcher/selection.json'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the selected KittyPatcher asset.' }

      - name: Verify digest and select executable
        shell: pwsh
        env:
          APPROVED_SHA256: ${{ inputs.approve_unverified_patcher_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/select_patcher.py verify `
            --selection 'work/_patcher/selection.json' `
            --approve-sha256 "$env:APPROVED_SHA256"
          if ($LASTEXITCODE -ne 0) { throw 'KittyPatcher verification failed. See the error above.' }
          Copy-Item 'work/_patcher/PatcherSelection.md' 'work/PatcherSelection.md' -Force
          Get-Content 'work/PatcherSelection.md' | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Patcher behavior canary
        timeout-minutes: 3
        shell: pwsh
        env:
          ACCEPT_FINDINGS: ${{ inputs.accept_patcher_behavior_findings }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sel = Get-Content 'work/_patcher/selection.json' -Raw | ConvertFrom-Json
          python .github/scripts/patcher_canary.py prepare 'work/_canary'
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare canary.' }
          $exeName = Split-Path $sel.exe_path -Leaf
          Copy-Item -LiteralPath $sel.exe_path -Destination (Join-Path 'work/_canary' $exeName) -Force
          Push-Location 'work/_canary'
          try { @('') | & ".\$exeName"; $code = $LASTEXITCODE } finally { Pop-Location }
          Remove-Item -LiteralPath (Join-Path 'work/_canary' $exeName) -Force
          if ($code -ne 0) { throw "Patcher exited with code $code on the canary." }
          python .github/scripts/patcher_canary.py check 'work/_canary' `
            --out 'work/PatcherCanary.json' --accept-findings "$env:ACCEPT_FINDINGS"
          $canaryCode = $LASTEXITCODE
          $report = Get-Content 'work/PatcherCanary.json' -Raw | ConvertFrom-Json
          "BUILD_LABEL=$($report.build_label)" >> $env:GITHUB_ENV
          if ($canaryCode -ne 0) { throw 'Patcher canary stopped the build before the real patch. See PatcherCanary.json.' }

      - name: Run KittyPatcher
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sel = Get-Content 'work/_patcher/selection.json' -Raw | ConvertFrom-Json
          $exeHash = (Get-FileHash -LiteralPath $sel.exe_path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -ne $sel.exe_sha256) { throw 'Selected executable changed after verification.' }
          $exe = Get-Item -LiteralPath $sel.exe_path

          Copy-Item -LiteralPath $exe.FullName `
            -Destination (Join-Path 'work' $exe.Name) `
            -Force

          $code = $null
          Push-Location 'work'

          try {
            @('') | & ".\$($exe.Name)"
            $code = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

          if ($code -ne 0) {
            throw "KittyPatcher exited with code $code."
          }

          if (-not (Test-Path -LiteralPath 'work/CourseOfTemptation.html')) {
            throw 'Expected game HTML is missing after patching.'
          }

          Remove-Item -LiteralPath (Join-Path 'work' $exe.Name) -Force

      - name: Generate diagnostic patch report
        id: report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python .github/scripts/patch_report.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Patch report generation failed.'
          }

          $path = 'work/StructuredPatchReport.md'

          if (-not (Test-Path -LiteralPath $path)) {
            throw 'Structured patch report is missing.'
          }

          if ((Get-Content -LiteralPath $path -TotalCount 1) -ne '# Patch report') {
            throw 'Unexpected structured patch report format.'
          }

      - name: Add diagnostic build badge
        env:
          BUILD_BADGE: ${{ steps.report.outputs.badge }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $path = (Resolve-Path 'work/CourseOfTemptation.html').Path
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [IO.File]::ReadAllText($path, $utf8)

          $message = $env:BUILD_BADGE

          if ([string]::IsNullOrWhiteSpace($message)) {
            $message = 'Diagnostic KittyPatcher build; gameplay unverified.'
          }

          $message = "[$env:BUILD_LABEL / patcher $env:PATCHER_RELEASE_TAG] $message"

          $badge = '<div id="modded-build-badge" style="position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#222;color:#fff;font:14px/1.3 sans-serif;padding:8px 44px 8px 12px;text-align:center;">' +
            [System.Net.WebUtility]::HtmlEncode($message) +
            '<button type="button" aria-label="Dismiss" onclick="this.parentNode.remove()" style="position:absolute;right:6px;top:4px;background:none;border:0;color:#fff;font-size:22px;">&times;</button></div>'

          $index = $text.LastIndexOf('</body>', [StringComparison]::Ordinal)

          if ($index -lt 0) {
            throw 'No closing body tag found; diagnostic badge was not added.'
          }

          $text = $text.Substring(0, $index) + $badge + $text.Substring($index)
          [IO.File]::WriteAllText($path, $text, $utf8)

      - name: Record build identity
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python .github/scripts/build_record.py --out 'work/BuildRecord.json'
          if (Test-Path 'work/BuildRecord.json') { Get-Content 'work/BuildRecord.json' | Out-String | Write-Output }

      - name: Generate AI handoff (build)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $handoffArgs = @('--stage', 'build',
            '--mods-source', 'work/_candidate/Merged_Mods.zip',
            '--candidate-report', 'work/CandidateInspection.md',
            '--selection', 'work/_patcher/selection.json',
            '--canary', 'work/PatcherCanary.json',
            '--logs-dir', 'work/mods/logs',
            '--previous-summary', '.github/handoff-baseline.json',
            '--out', 'work/CourseOfTemptation-AI-Handoff.md',
            '--summary-out', 'work/handoff-summary.json')
          python .github/scripts/make_handoff.py @handoffArgs

      - name: Upload AI handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GIVE-TO-AI--Build-Handoff
          path: |
            work/CourseOfTemptation-AI-Handoff.md
            work/handoff-summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload candidate inspection and patch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patcher-Checks-and-Build-Reports
          path: |
            work/CandidateInspection.md
            work/StructuredPatchReport.md
            work/PatcherSelection.md
            work/PatcherCanary.json
            work/BuildRecord.json
            work/_patcher/selection.json
            work/_patcher/latest-release.json
            work/_canary/mods/logs/*.txt
          if-no-files-found: warn

      - name: Upload diagnostic game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Game--Gameplay-Unverified
          path: work/CourseOfTemptation.html
          if-no-files-found: error

      - name: Upload raw patcher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patcher-Logs--Troubleshooting
          path: work/mods/logs/*.txt
          if-no-files-found: ignore
