name: 03 - Merge and Patch Reviewed Mods

on:
  workflow_dispatch:
    inputs:
      inspection_reviewed:
        description: 'I reviewed the current inspection and updated the merger where required.'
        required: true
        type: boolean
        default: false
      accept_static_warnings:
        description: 'I reviewed candidate warnings and accept diagnostic patching.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: merge-and-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge reviewed original mods
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      candidate_artifact: ${{ steps.artifact_info.outputs.name }}

    steps:
      - name: Require inspection review
        env:
          INSPECTION_REVIEWED: ${{ inputs.inspection_reviewed }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$INSPECTION_REVIEWED" != "true" ]; then
            echo "::error::Review the current inspection before starting this build."
            exit 1
          fi

      - name: Check out selected build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set candidate artifact name
        id: artifact_info
        shell: bash
        run: |
          echo "name=Merged-Mods-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Apply reviewed merge rules
        run: python scripts/merge_mods.py

      - name: Verify merge outputs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          output = Path("merge-output")
          archive = output / "Merged_Mods.zip"
          manifest = output / "MergeManifest.json"

          if not archive.is_file() or not manifest.is_file():
              raise SystemExit("Candidate archive or manifest is missing.")

          data = json.loads(manifest.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("Merge manifest must contain a JSON object.")

          with zipfile.ZipFile(archive) as handle:
              bad = handle.testzip()

              if bad is not None:
                  raise SystemExit(f"Candidate ZIP integrity failure: {bad}")

              mods = [
                  item for item in handle.infolist()
                  if not item.is_dir()
                  and item.filename.lower().endswith(".mod")
              ]

              if not mods:
                  raise SystemExit("Candidate contains no .mod files.")

          print(f"Candidate contains {len(mods)} mod files.")
          PY

      - name: Upload candidate archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_info.outputs.name }}
          path: |
            merge-output/Merged_Mods.zip
            merge-output/MergeManifest.json
          if-no-files-found: error

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Merge-Report-${{ github.run_id }}-${{ github.run_attempt }}
          path: merge-output/MergeReport.md
          if-no-files-found: warn

      - name: Show continuation
        env:
          CANDIDATE_ARTIFACT: ${{ steps.artifact_info.outputs.name }}
        shell: bash
        run: |
          {
            echo "## Build continuation"
            echo ""
            echo "- Candidate artifact: $CANDIDATE_ARTIFACT"
            echo "- Candidate inspection runs next."
            echo "- Patching proceeds only if checks permit."
            echo "- KittyPatcher is selected from this repository's latest release."
            echo "- No release tag or Merge Run ID entry is required."
          } >> "$GITHUB_STEP_SUMMARY"

  patch:
    name: Inspect candidate and patch game
    needs: merge
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_RUN_ID: ${{ github.run_id }}
      ACCEPT_STATIC_WARNINGS: ${{ inputs.accept_static_warnings }}

    steps:
      - name: Check out the same build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create working folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path 'work/_candidate' -Force |
            Out-Null

          if (Test-Path -LiteralPath 'work/mods') {
            Remove-Item -LiteralPath 'work/mods' -Recurse -Force
          }

      - name: Download candidate from merge job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.merge.outputs.candidate_artifact }}
          path: work/_candidate

      - name: Verify manifest and inspect candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python scripts/check_candidate.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Candidate checks stopped the build. Read CandidateInspection.md.'
          }

      - name: Prepare accepted mods for KittyPatcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python - @'
          import json
          import shutil
          from pathlib import Path

          root = Path("work/mods")
          staging = Path("work/_flat_mods")

          if not root.is_dir():
              raise SystemExit("Candidate checker did not create work/mods.")

          mods = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() == ".mod"
          )

          manifest = json.loads(
              Path("work/_candidate/MergeManifest.json").read_text(
                  encoding="utf-8"
              )
          )

          if not mods or len(mods) != manifest.get("mod_count"):
              raise SystemExit("Accepted mod count does not match the manifest.")

          seen = set()

          for path in mods:
              key = path.name.casefold()

              if key in seen:
                  raise SystemExit(
                      f"Duplicate mod basename cannot be flattened: {path.name}"
                  )

              seen.add(key)

          if staging.exists():
              shutil.rmtree(staging)

          staging.mkdir(parents=True)

          for path in mods:
              shutil.copyfile(path, staging / path.name)

          shutil.rmtree(root)
          staging.rename(root)

          print(f"Prepared {len(mods)} accepted mods, with one copy per mod.")
          '@

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not prepare accepted mods for KittyPatcher.'
          }

      - name: Copy original game into working folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Copy-Item -LiteralPath 'CourseOfTemptation.html' `
            -Destination 'work/CourseOfTemptation.html' `
            -Force

          if (-not (Test-Path -LiteralPath 'work/CourseOfTemptation.html')) {
            throw 'Working game HTML is missing.'
          }

      - name: Select and download latest KittyPatcher release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tagOutput = gh release view `
            --repo "$env:GITHUB_REPOSITORY" `
            --json tagName `
            --jq '.tagName'

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not identify the latest repository release.'
          }

          $tag = ($tagOutput | Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'The latest release returned an empty tag.'
          }

          "PATCHER_RELEASE_TAG=$tag" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Path 'work/_patcher_dl' -Force |
            Out-Null

          @(
            '# Patcher selection'
            ''
            '- Selection: latest repository release'
            "- Repository: $env:GITHUB_REPOSITORY"
            "- Resolved release tag: $tag"
            ''
          ) | Set-Content 'work/PatcherSelection.md' -Encoding utf8

          gh release download "$tag" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern 'KittyPatcher*.zip' `
            --dir 'work/_patcher_dl'

          if ($LASTEXITCODE -ne 0) {
            throw "Could not download KittyPatcher*.zip from latest release '$tag'."
          }

          $zips = @(
            Get-ChildItem -LiteralPath 'work/_patcher_dl' `
              -Filter 'KittyPatcher*.zip' `
              -File
          )

          if ($zips.Count -ne 1) {
            throw "Latest release '$tag' must contain exactly one KittyPatcher ZIP; found $($zips.Count)."
          }

          $hash = (
            Get-FileHash -LiteralPath $zips[0].FullName -Algorithm SHA256
          ).Hash

          @(
            "- Asset: $($zips[0].Name)"
            "- SHA256: $hash"
            ''
          ) | Add-Content 'work/PatcherSelection.md' -Encoding utf8

          @(
            '## Automatic patcher selection'
            ''
            "- Latest release tag: $tag"
            "- Asset: $($zips[0].Name)"
            "- SHA256: $hash"
            ''
          ) | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8

          Expand-Archive -LiteralPath $zips[0].FullName `
            -DestinationPath 'work/_patcher' `
            -Force

      - name: Run KittyPatcher
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $executables = @(
            Get-ChildItem -LiteralPath 'work/_patcher' `
              -Recurse `
              -File `
              -Filter 'KittyPatcher*.exe'
          )

          if ($executables.Count -ne 1) {
            throw "Expected one KittyPatcher EXE; found $($executables.Count)."
          }

          $exe = $executables[0]

          Copy-Item -LiteralPath $exe.FullName `
            -Destination (Join-Path 'work' $exe.Name) `
            -Force

          $code = $null
          Push-Location 'work'

          try {
            @('') | & ".\$($exe.Name)"
            $code = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

          if ($code -ne 0) {
            throw "KittyPatcher exited with code $code."
          }

          if (-not (Test-Path -LiteralPath 'work/CourseOfTemptation.html')) {
            throw 'Expected game HTML is missing after patching.'
          }

          Remove-Item -LiteralPath (Join-Path 'work' $exe.Name) -Force

      - name: Generate diagnostic patch report
        id: report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python scripts/patch_report.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Patch report generation failed.'
          }

          $path = 'work/StructuredPatchReport.md'

          if (-not (Test-Path -LiteralPath $path)) {
            throw 'Structured patch report is missing.'
          }

          if ((Get-Content -LiteralPath $path -TotalCount 1) -ne '# Patch report') {
            throw 'Unexpected structured patch report format.'
          }

      - name: Add diagnostic build badge
        env:
          BUILD_BADGE: ${{ steps.report.outputs.badge }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $path = (Resolve-Path 'work/CourseOfTemptation.html').Path
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [IO.File]::ReadAllText($path, $utf8)

          $message = $env:BUILD_BADGE

          if ([string]::IsNullOrWhiteSpace($message)) {
            $message = 'Diagnostic KittyPatcher build; gameplay unverified.'
          }

          $badge = '<div id="modded-build-badge" style="position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#222;color:#fff;font:14px/1.3 sans-serif;padding:8px 44px 8px 12px;text-align:center;">' +
            [System.Net.WebUtility]::HtmlEncode($message) +
            '<button type="button" aria-label="Dismiss" onclick="this.parentNode.remove()" style="position:absolute;right:6px;top:4px;background:none;border:0;color:#fff;font-size:22px;">&times;</button></div>'

          $index = $text.LastIndexOf('</body>', [StringComparison]::Ordinal)

          if ($index -lt 0) {
            throw 'No closing body tag found; diagnostic badge was not added.'
          }

          $text = $text.Substring(0, $index) + $badge + $text.Substring($index)
          [IO.File]::WriteAllText($path, $text, $utf8)

      - name: Upload candidate inspection and patch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patch-Reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/CandidateInspection.md
            work/StructuredPatchReport.md
            work/PatcherSelection.md
          if-no-files-found: warn

      - name: Upload diagnostic game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic-Game-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/CourseOfTemptation.html
          if-no-files-found: error

      - name: Upload raw patcher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raw-Patcher-Logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/mods/logs/*.txt
          if-no-files-found: ignore
