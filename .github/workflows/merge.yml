name: 03 - Merge and Patch Reviewed Mods

on:
  workflow_dispatch:
    inputs:
      inspection_reviewed:
        description: 'I reviewed the matching input inspection and any required merger changes.'
        required: true
        type: boolean
        default: false

      patcher_release_tag:
        description: 'Exact repository release tag containing one KittyPatcher*.zip asset.'
        required: true
        type: string

      accept_static_warnings:
        description: 'I reviewed candidate warnings and authorize a diagnostic patch run.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: merge-and-patch-${{ github.sha }}
  cancel-in-progress: false

jobs:

  merge:
    name: Merge reviewed original mods
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      candidate_artifact: ${{ steps.artifact.outputs.name }}

    env:
      GH_TOKEN: ${{ github.token }}
      INSPECTION_REVIEWED: ${{ inputs.inspection_reviewed }}

    steps:

      - name: Require explicit review acknowledgment
        shell: bash
        run: |
          set -euo pipefail

          if [ "$INSPECTION_REVIEWED" != "true" ]; then
            echo "::error::Review the matching inspection before starting the combined build."
            exit 1
          fi

      - name: Check out the exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download matching inspection artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf inspection-bundle
          mkdir -p inspection-bundle

          run_json="$(
            gh run list \
              --workflow '02 - Inspect Input Compatibility' \
              --limit 50 \
              --json databaseId,headSha,conclusion,runNumber \
              --jq '[.[] | select(.headSha == "'"'${GITHUB_SHA}'"'" and .conclusion == "success")] | .[0]'
          )"

          if [ -z "$run_json" ] || [ "$run_json" = "null" ]; then
            echo "::error::No successful compatibility inspection was found for commit $GITHUB_SHA."
            exit 1
          fi

          run_id="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["databaseId"])' \
              <<< "$run_json"
          )"

          run_number="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["runNumber"])' \
              <<< "$run_json"
          )"

          echo "Using inspection run $run_id (run number $run_number)."

          gh run download \
            "$run_id" \
            --name "Input-Compatibility-Report-$run_number" \
            --dir inspection-bundle

          test -f inspection-bundle/InspectionData.json
          test -f inspection-bundle/BundleManifest.json

      - name: Create reviewed candidate
        run: python scripts/merge_mods.py

      - name: Verify merge outputs
        shell: bash
        run: |
          set -euo pipefail

          test -s merge-output/Merged_Mods.zip
          test -s merge-output/MergeManifest.json
          test -s merge-output/MergeReport.md

          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          manifest = json.loads(
              Path("merge-output/MergeManifest.json")
              .read_text(encoding="utf-8")
          )

          assert manifest["candidate_status"] == "diagnostic_candidate"

          with zipfile.ZipFile("merge-output/Merged_Mods.zip") as z:
              assert z.testzip() is None

              mods = [
                  name
                  for name in z.namelist()
                  if name.lower().endswith(".mod")
              ]

          assert len(mods) == 52, len(mods)

          print(f"Candidate contains {len(mods)} mod files.")
          PY

      - name: Set candidate artifact name
        id: artifact
        shell: bash
        run: |
          echo "name=Merged-Mods-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload candidate archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            merge-output/Merged_Mods.zip
            merge-output/MergeManifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Merge-Report-${{ github.run_id }}-${{ github.run_attempt }}
          path: merge-output/MergeReport.md
          if-no-files-found: warn
          retention-days: 30


  patch:
    name: Validate candidate and run KittyPatcher
    needs: merge
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_RUN_ID: ${{ github.run_id }}
      PATCHER_RELEASE_TAG: ${{ inputs.patcher_release_tag }}
      ACCEPT_STATIC_WARNINGS: ${{ inputs.accept_static_warnings }}
      ORIGINAL_GAME_SHA256: ${{ vars.COURSE_OF_TEMPTATION_GAME_SHA256 }}

    steps:

      - name: Check out the exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require patcher release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:PATCHER_RELEASE_TAG)) {
            throw 'An exact KittyPatcher release tag is required.'
          }

      - name: Create working folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item `
            -ItemType Directory `
            -Path 'work/_candidate','work/mods' `
            -Force |
            Out-Null

      - name: Download exact candidate artifact from merge job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.merge.outputs.candidate_artifact }}
          path: work/_candidate

      - name: Validate candidate provenance and structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python scripts/check_candidate.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Candidate validation stopped the patch stage.'
          }

      - name: Prepare KittyPatcher input directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = Get-ChildItem `
            -LiteralPath 'work/_candidate' `
            -Recurse `
            -File `
            -Filter 'Merged_Mods.zip'

          if ($archive.Count -ne 1) {
            throw "Expected exactly one Merged_Mods.zip; found $($archive.Count)."
          }

          Expand-Archive `
            -LiteralPath $archive[0].FullName `
            -DestinationPath 'work/_expanded' `
            -Force

          $mods = @(
            Get-ChildItem `
              -LiteralPath 'work/_expanded' `
              -Recurse `
              -File |
            Where-Object {
              $_.Extension -ieq '.mod'
            }
          )

          if ($mods.Count -ne 52) {
            throw "Expected 52 candidate mods; found $($mods.Count)."
          }

          $seen = @{}

          foreach ($mod in $mods) {
            $key = $mod.Name.ToLowerInvariant()

            if ($seen.ContainsKey($key)) {
              throw "Duplicate mod basename for KittyPatcher: $($mod.Name)"
            }

            $seen[$key] = $true

            Copy-Item `
              -LiteralPath $mod.FullName `
              -Destination (Join-Path 'work/mods' $mod.Name) `
              -Force
          }

          Copy-Item `
            -LiteralPath 'CourseOfTemptation.html' `
            -Destination 'work/CourseOfTemptation.html' `
            -Force

      - name: Record original game hash before patching
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $hash = (
            Get-FileHash `
              -LiteralPath 'CourseOfTemptation.html' `
              -Algorithm SHA256
          ).Hash

          "ORIGINAL_GAME_SHA256=$hash" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PATCHED_GAME_PATH=work/CourseOfTemptation.html" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Download exact KittyPatcher release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item `
            -ItemType Directory `
            -Path 'work/_patcher_dl' `
            -Force |
            Out-Null

          gh release download `
            "$env:PATCHER_RELEASE_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern 'KittyPatcher*.zip' `
            --dir 'work/_patcher_dl'

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download the selected KittyPatcher release asset.'
          }

          $zips = @(
            Get-ChildItem `
              -LiteralPath 'work/_patcher_dl' `
              -Filter 'KittyPatcher*.zip' `
              -File
          )

          if ($zips.Count -ne 1) {
            throw "Expected exactly one KittyPatcher ZIP; found $($zips.Count)."
          }

          $hash = (
            Get-FileHash `
              -LiteralPath $zips[0].FullName `
              -Algorithm SHA256
          ).Hash

          @(
            '# Patcher selection'
            ''
            '- Release tag: ' + $env:PATCHER_RELEASE_TAG
            '- Asset: ' + $zips[0].Name
            '- SHA256: ' + $hash
            ''
          ) |
            Set-Content `
              -LiteralPath 'work/PatcherSelection.md' `
              -Encoding utf8

          Expand-Archive `
            -LiteralPath $zips[0].FullName `
            -DestinationPath 'work/_patcher' `
            -Force

      - name: Verify KittyPatcher executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exes = @(
            Get-ChildItem `
              -LiteralPath 'work/_patcher' `
              -Recurse `
              -File `
              -Filter 'KittyPatcher*.exe'
          )

          if ($exes.Count -ne 1) {
            throw "Expected exactly one KittyPatcher executable; found $($exes.Count)."
          }

          Copy-Item `
            -LiteralPath $exes[0].FullName `
            -Destination (Join-Path 'work' $exes[0].Name) `
            -Force

      - name: Run KittyPatcher
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Push-Location 'work'

          try {
            @('') |
              & (
                Join-Path `
                  (Get-Location) `
                  ((Get-ChildItem -Filter 'KittyPatcher*.exe' -File)[0].Name)
              )

            $code = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

          if ($code -ne 0) {
            throw "KittyPatcher exited with code $code."
          }

          if (-not (
            Test-Path `
              -LiteralPath 'work/CourseOfTemptation.html'
          )) {
            throw 'Patcher did not leave an output HTML file.'
          }

      - name: Generate structured patch report
        id: patch_report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python scripts/patch_report.py

          if ($LASTEXITCODE -ne 0) {
            throw 'Patch report generation failed.'
          }

      - name: Add diagnostic build badge
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $path = (
            Resolve-Path 'work/CourseOfTemptation.html'
          ).Path

          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $text = [IO.File]::ReadAllText(
            $path,
            $utf8
          )

          $badge = '<div id="modded-build-badge" style="position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#222;color:#fff;font:14px/1.3 sans-serif;padding:8px 44px 8px 12px;text-align:center;">Diagnostic KittyPatcher build<button type="button" aria-label="Dismiss" onclick="this.parentNode.remove()" style="position:absolute;right:6px;top:4px;background:none;border:0;color:#fff;font-size:22px;">&times;</button></div>'

          $index = $text.LastIndexOf(
            '</body>',
            [StringComparison]::Ordinal
          )

          if ($index -lt 0) {
            throw 'No closing body tag found; badge was not added.'
          }

          [IO.File]::WriteAllText(
            $path,
            $text.Substring(0,$index) +
            $badge +
            $text.Substring($index),
            $utf8
          )

      - name: Upload patch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patch-Reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/CandidateInspection.md
            work/StructuredPatchReport.md
            work/PatcherSelection.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostic game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic-Game-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/CourseOfTemptation.html
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw KittyPatcher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raw-Patcher-Logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/mods/logs/
          if-no-files-found: warn
          retention-days: 30
