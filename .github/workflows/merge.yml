name: 03 - Merge and Patch Reviewed Mods
on:
  workflow_dispatch:
    inputs:
      inspection_reviewed:
        description: 'I reviewed the current input inspection and updated the merger where required.'
        required: true
        type: boolean
        default: false
      patcher_release_tag:
        description: 'Exact release tag containing KittyPatcher*.zip.'
        required: true
        type: string
      accept_static_warnings:
        description: 'I reviewed candidate warnings from a prior build and accept diagnostic patching.'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: merge-and-patch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  merge:
    name: Merge reviewed original mods
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_artifact: ${{ steps.artifact_info.outputs.name }}
    steps:
      - name: Require inspection review and patcher selection
        env:
          INSPECTION_REVIEWED: ${{ inputs.inspection_reviewed }}
          PATCHER_RELEASE_TAG: ${{ inputs.patcher_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$INSPECTION_REVIEWED" != "true" ]; then
            echo "::error::Review the current input inspection and update the merger where required."
            exit 1
          fi
          if [ -z "${PATCHER_RELEASE_TAG// }" ]; then
            echo "::error::Enter the exact KittyPatcher release tag."
            exit 1
          fi
      - name: Check out selected build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set candidate artifact name
        id: artifact_info
        shell: bash
        run: |
          set -euo pipefail
          name="Merged-Mods-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Apply reviewed merge rules
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merge_mods.py
      - name: Verify merge outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f merge-output/Merged_Mods.zip
          test -f merge-output/MergeManifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          import zipfile
          output = Path("merge-output")
          archive = output / "Merged_Mods.zip"
          manifest = output / "MergeManifest.json"
          with manifest.open("r", encoding="utf-8") as fh:
              data = json.load(fh)
          if not isinstance(data, dict):
              raise SystemExit("MergeManifest.json must contain an object.")
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f"Candidate ZIP is corrupt: {bad}")
              mod_files = [
                  name for name in zf.namelist()
                  if name.lower().endswith(".mod")
              ]
              if not mod_files:
                  raise SystemExit("Merged_Mods.zip contains no .mod files.")
          print(f"Candidate archive: {archive}")
          print(f"Candidate .mod files: {len(mod_files)}")
          PY
      - name: Upload candidate archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_info.outputs.name }}
          path: |
            merge-output/Merged_Mods.zip
            merge-output/MergeManifest.json
          if-no-files-found: error
      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Merge-Report-${{ github.run_id }}-${{ github.run_attempt }}
          path: merge-output/MergeReport.md
          if-no-files-found: warn
      - name: Show automatic continuation
        env:
          CANDIDATE_ARTIFACT: ${{ steps.artifact_info.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Build continuation"
            echo ""
            echo "- Candidate archive: Merged_Mods.zip"
            echo "- Candidate artifact: $CANDIDATE_ARTIFACT"
            echo "- Candidate inspection runs next."
            echo "- Patching continues only if candidate checks allow it."
            echo "- No manual artifact transfer or Run ID entry is required."
          } >> "$GITHUB_STEP_SUMMARY"
  patch:
    name: Inspect candidate and patch game
    needs: merge
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_RUN_ID: ${{ github.run_id }}
      PATCHER_RELEASE_TAG: ${{ inputs.patcher_release_tag }}
      ACCEPT_STATIC_WARNINGS: ${{ inputs.accept_static_warnings }}
    steps:
      - name: Check out the same build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create working folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'work' -Force | Out-Null
          New-Item -ItemType Directory -Path 'work/_candidate' -Force | Out-Null
          New-Item -ItemType Directory -Path 'work/mods' -Force | Out-Null
      - name: Download the candidate selected by the merge job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.merge.outputs.candidate_artifact }}
          path: work/_candidate
      - name: Verify manifest and inspect candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/check_candidate.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Candidate preflight stopped. Review CandidateInspection.md before allowing patching.'
          }
      - name: Locate candidate archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(
            Get-ChildItem -LiteralPath 'work/_candidate' -Recurse -File |
              Where-Object { $_.Name -eq 'Merged_Mods.zip' }
          )
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Merged_Mods.zip; found $($archives.Count)."
          }
          Copy-Item -LiteralPath $archives[0].FullName `
            -Destination 'work/Merged_Mods.zip' `
            -Force
          Write-Host "Candidate archive: $($archives[0].FullName)"
      - name: Extract candidate mods for KittyPatcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path 'work/Merged_Mods.zip').Path
          $extractRoot = Join-Path (Resolve-Path 'work').Path '_candidate_extracted'
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -LiteralPath $zip `
            -DestinationPath $extractRoot `
            -Force
          $mods = @(
            Get-ChildItem -LiteralPath $extractRoot -Recurse -File |
              Where-Object { $_.Extension -ieq '.mod' }
          )
          if ($mods.Count -eq 0) {
            throw 'Merged_Mods.zip extracted successfully but contains no .mod files.'
          }
          foreach ($mod in $mods) {
            $destination = Join-Path 'work/mods' $mod.Name
            if (Test-Path -LiteralPath $destination) {
              throw "Duplicate .mod filename after extraction: $($mod.Name)"
            }
            Copy-Item -LiteralPath $mod.FullName `
              -Destination $destination
          }
          $installed = @(
            Get-ChildItem -LiteralPath 'work/mods' -File |
              Where-Object { $_.Extension -ieq '.mod' }
          )
          if ($installed.Count -ne $mods.Count) {
            throw "Expected $($mods.Count) extracted .mod files but installed $($installed.Count)."
          }
          Write-Host "Prepared $($installed.Count) .mod files for KittyPatcher."
      - name: Copy original HTML into working folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath 'CourseOfTemptation.html' `
            -Destination 'work/CourseOfTemptation.html' `
            -Force
      - name: Verify patcher inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'work/CourseOfTemptation.html')) {
            throw 'CourseOfTemptation.html was not copied into the patcher working folder.'
          }
          $mods = @(
            Get-ChildItem -LiteralPath 'work/mods' -File |
              Where-Object { $_.Extension -ieq '.mod' }
          )
          if ($mods.Count -eq 0) {
            throw 'No .mod files are present in work/mods.'
          }
          Write-Host "Patcher input HTML: work/CourseOfTemptation.html"
          Write-Host "Patcher input mods: $($mods.Count)"
      - name: Download selected KittyPatcher release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'work/_patcher_dl' -Force |
            Out-Null
          gh release download "$env:PATCHER_RELEASE_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern 'KittyPatcher*.zip' `
            --dir 'work/_patcher_dl'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download KittyPatcher from the selected release tag.'
          }
          $zips = @(
            Get-ChildItem -LiteralPath 'work/_patcher_dl' `
              -Filter 'KittyPatcher*.zip' -File
          )
          if ($zips.Count -ne 1) {
            throw "Expected exactly one KittyPatcher ZIP; found $($zips.Count)."
          }
          $patcherHash = (
            Get-FileHash -LiteralPath $zips[0].FullName -Algorithm SHA256
          ).Hash
          @(
            '# Patcher selection'
            ''
            "- Release tag: $env:PATCHER_RELEASE_TAG"
            "- Asset: $($zips[0].Name)"
            "- SHA256: $patcherHash"
            ''
          ) | Set-Content -LiteralPath 'work/PatcherSelection.md' -Encoding utf8
          Expand-Archive -LiteralPath $zips[0].FullName `
            -DestinationPath 'work/_patcher' `
            -Force
      - name: Run KittyPatcher
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'work/_patcher').Path
          $candidates = @(
            Get-ChildItem -LiteralPath $root -Recurse -File `
              -Filter 'KittyPatcher*.exe'
          )
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one KittyPatcher EXE; found $($candidates.Count)."
          }
          $exe = $candidates[0]
          Write-Host "Using patcher: $($exe.FullName)"
          Copy-Item -LiteralPath $exe.FullName `
            -Destination (Join-Path 'work' $exe.Name) `
            -Force
          Push-Location 'work'
          try {
            @('') | & ".\$($exe.Name)"
            $code = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          if ($code -ne 0) {
            throw "KittyPatcher exited with code $code."
          }
          if (-not (Test-Path -LiteralPath 'work/CourseOfTemptation.html')) {
            throw 'KittyPatcher completed but the expected output HTML is missing.'
          }
          Remove-Item -LiteralPath (Join-Path 'work' $exe.Name) -Force
      - name: Generate diagnostic patch report
        id: report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/patch_report.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Patch report generation failed.'
          }
          $reportPath = 'work/StructuredPatchReport.md'
          if (-not (Test-Path -LiteralPath $reportPath)) {
            throw 'Structured patch report was not generated.'
          }
          $firstLine = Get-Content `
            -LiteralPath $reportPath `
            -TotalCount 1
          if ($firstLine -ne '# Patch report') {
            throw 'Structured patch report validation failed.'
          }
          Get-Content -LiteralPath $reportPath `
            -TotalCount 10
      - name: Add diagnostic build badge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path 'work/CourseOfTemptation.html').Path
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [IO.File]::ReadAllText($path, $utf8)
          $message = 'Diagnostic KittyPatcher build'
          $badge = '<div id="modded-build-badge" style="position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#222;color:#fff;font:14px/1.3 sans-serif;padding:8px 44px 8px 12px;text-align:center;">' +
            [System.Net.WebUtility]::HtmlEncode($message) +
            '<button type="button" aria-label="Dismiss" onclick="this.parentNode.remove()" style="position:absolute;right:6px;top:4px;background:none;border:0;color:#fff;font-size:22px;">&times;</button></div>'
          $index = $text.LastIndexOf('</body>', [StringComparison]::Ordinal)
          if ($index -lt 0) {
            throw 'No closing body tag found; badge was not added.'
          }
          $text = $text.Substring(0, $index) +
            $badge +
            $text.Substring($index)
          [IO.File]::WriteAllText($path, $text, $utf8)
      - name: Upload candidate inspection and patch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patch-Reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/CandidateInspection.md
            work/StructuredPatchReport.md
            work/PatcherSelection.md
          if-no-files-found: warn
      - name: Upload diagnostic game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic-Game-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/CourseOfTemptation.html
          if-no-files-found: error
      - name: Upload raw patcher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raw-Patcher-Logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/mods/logs/*.txt
          if-no-files-found: ignore
